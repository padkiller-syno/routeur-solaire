; Sonde déportée du ballon : Arduino Pro Mini + DS18B20 + émetteur 433 MHz STX882, sur 18650.
; Choisir l'environnement selon le quartz du Pro Mini (8 MHz = version 3,3 V, 16 MHz = version 5 V).
;   pio run -e pro_mini_16mhz -t upload --upload-port /dev/ttyUSB0
[platformio]
default_envs = pro_mini_16mhz

[env]
platform = atmelavr
framework = arduino
board = pro8MHzatmega328
lib_deps = paulstoffregen/OneWire@^2.3.8
upload_speed = 57600
monitor_speed = 57600

; Pro Mini 3,3 V, quartz 8 MHz
[env:pro_mini_8mhz]

; Pro Mini 5 V, quartz 16 MHz : divisé par 2 au démarrage (16 MHz est hors spécification sous 3,8 V, la 18650
; descend à 3,0 V). Le code est compilé pour 8 MHz, les durées restent justes. Le bootloader, lui, tourne à 16 MHz
; avant la division : téléversement à 57600 bauds comme d'origine.
[env:pro_mini_16mhz]
build_flags = -DQUARTZ_16MHZ

; Versions de test : affichent la mesure et la trame sur le port série (pio device monitor) à chaque envoi.
[env:pro_mini_16mhz_debug]
build_flags = -DQUARTZ_16MHZ -DDEBUG

[env:pro_mini_8mhz_debug]
build_flags = -DDEBUG
