<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="1240" height="900" fill="#ffffff"/>
  <style>
    .titre { font-weight: bold; font-size: 16px; fill: #222; }
    .petit { font-size: 11.5px; fill: #444; }
    .cote { stroke: #c0392b; stroke-width: 1.4; fill: none; }
    .ctxt { font-size: 13px; font-weight: bold; fill: #c0392b; }
    .pcb { fill: #2b6cb0; stroke: #1a4580; stroke-width: 1.5; }
    .pin { fill: #f1c40f; stroke: #8a6d00; stroke-width: 0.8; }
    .hole { fill: #fff; stroke: #333; stroke-width: 1.2; }
    .hv { fill: #f39c12; opacity: 0.35; }
    th, td { }
  </style>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Fiche de mesures : à relever sur chaque module (au pied à coulisse)</text>
  <text x="620" y="60" text-anchor="middle" class="petit">Module posé composants vers le haut, broches de commande à gauche. Toutes les cotes depuis le coin bas-gauche du circuit, en mm, au 0,1 mm.</text>

  <!-- ====== module générique ====== -->
  <text x="60" y="105" class="titre">Ce que je dois connaître pour chaque module</text>
  <g transform="translate(150,140)">
    <rect x="0" y="0" width="460" height="280" rx="6" class="pcb"/>
    <rect x="300" y="0" width="160" height="280" class="hv"/>
    <text x="380" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a00">partie 230 V</text>
    <text x="380" y="156" text-anchor="middle" font-size="11" fill="#7a4a00">(borniers, triac…)</text>
    <circle cx="28" cy="28" r="12" class="hole"/><circle cx="28" cy="252" r="12" class="hole"/>
    <circle cx="432" cy="28" r="12" class="hole"/><circle cx="432" cy="252" r="12" class="hole"/>
    <g><rect x="62" y="95" width="16" height="16" class="pin"/><rect x="62" y="122" width="16" height="16" class="pin"/><rect x="62" y="149" width="16" height="16" class="pin"/><rect x="62" y="176" width="16" height="16" class="pin"/></g>
    <text x="122" y="108" font-size="11" fill="#fff" font-weight="bold">broche 1 (repère carré)</text>
    <!-- origine -->
    <circle cx="0" cy="280" r="5" fill="#c0392b"/><text x="-12" y="300" class="ctxt">0</text>
    <!-- L -->
    <path d="M0 310 H460" class="cote" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="230" y="330" text-anchor="middle" class="ctxt">L</text>
    <!-- l -->
    <path d="M490 0 V280" class="cote" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="505" y="145" class="ctxt">l</text>
    <!-- trou -->
    <path d="M0 252 H16" class="cote"/><path d="M28 280 V264" class="cote"/>
    <text x="-140" y="270" class="ctxt">T1 (x, y)</text>
    <path d="M18 244 L-40 214" class="cote"/>
    <text x="-140" y="214" class="ctxt">Ø trou</text>
    <!-- broche 1 -->
    <path d="M66 99 L-20 -6" class="cote"/><text x="-140" y="-10" class="ctxt">B1 (x, y) = centre broche 1</text>
    <path d="M100 103 V184" class="cote" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="106" y="150" font-size="13" font-weight="bold" fill="#fff">pas</text>
    <!-- 230 V -->
    <path d="M300 -18 H460" class="cote" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="380" y="-24" text-anchor="middle" class="ctxt">Z (début zone 230 V)</text>
  </g>
  <g transform="translate(700,150)">
    <text x="0" y="0" class="titre">À noter pour chaque module</text>
    <text x="0" y="28">• <tspan font-weight="bold">L × l</tspan> : longueur et largeur du circuit</text>
    <text x="0" y="52">• <tspan font-weight="bold">T1, T2…</tspan> : centre de chaque trou de fixation (x, y) et son <tspan font-weight="bold">Ø</tspan></text>
    <text x="0" y="76">• <tspan font-weight="bold">B1</tspan> : centre de la broche 1 du connecteur de commande,</text>
    <text x="14" y="96">le <tspan font-weight="bold">pas</tspan> (souvent 2,54) et le sens (vers le haut / la droite)</text>
    <text x="0" y="120">• l'ordre des broches (ex. VCC, GND, Z-C, PWM)</text>
    <text x="0" y="144">• <tspan font-weight="bold">Z</tspan> : où commence la partie 230 V (pour la zone sans cuivre)</text>
    <text x="0" y="168">• <tspan font-weight="bold">h</tspan> : hauteur des composants sous le module (pour les entretoises)</text>
    <text x="0" y="192">• <tspan font-weight="bold">H</tspan> : hauteur totale au-dessus (radiateur, relais : pour le boîtier)</text>
    <text x="0" y="226" class="petit">Le plus simple : une photo de chaque face du module posé sur du papier</text>
    <text x="0" y="242" class="petit">millimétré ou à côté d'une règle, plus les cotes au pied à coulisse.</text>
    <text x="0" y="270" class="petit">Broches de commande soudées vers le bas ? Le module se pique alors directement</text>
    <text x="0" y="286" class="petit">dans une barrette femelle du PCB. Sinon, on prévoit des barrettes coudées.</text>
  </g>

  <!-- ====== tableau ====== -->
  <text x="60" y="520" class="titre">Modules à mesurer (ce que j'ai déjà, d'après vos photos)</text>
  <g transform="translate(60,540)" font-size="12.5">
    <rect x="0" y="0" width="1120" height="30" fill="#2c3e50"/>
    <text x="10" y="20" fill="#fff" font-weight="bold">Module</text>
    <text x="250" y="20" fill="#fff" font-weight="bold">Qté</text>
    <text x="300" y="20" fill="#fff" font-weight="bold">Déjà connu</text>
    <text x="640" y="20" fill="#fff" font-weight="bold">À mesurer</text>

    <rect x="0" y="30" width="1120" height="44" fill="#f4f6f8"/>
    <text x="10" y="56" font-weight="bold">ESP32 DevKit V1 (30 broches)</text><text x="255" y="56">1</text>
    <text x="300" y="56">≈ 55 × 28 mm, 2 × 15 broches au pas 2,54</text>
    <text x="640" y="56"><tspan font-weight="bold">écart entre les deux rangées</tspan> (22,86 ou 25,4 mm selon les cartes)</text>

    <rect x="0" y="74" width="1120" height="44" fill="#ffffff"/>
    <text x="10" y="100" font-weight="bold">Dimmer RobotDyn HL 16/24 A</text><text x="255" y="100">2</text>
    <text x="300" y="100">60 × 42 mm, 4 broches : VCC GND Z-C PWM</text>
    <text x="640" y="100">trous (x, y, Ø), broche 1, Z, hauteur du radiateur H</text>

    <rect x="0" y="118" width="1120" height="44" fill="#f4f6f8"/>
    <text x="10" y="144" font-weight="bold">JSY-MK-194T</text><text x="255" y="144">1</text>
    <text x="300" y="144">60,5 × 36,8 mm, 5 broches : VCC RX TX PF GND</text>
    <text x="640" y="144">trous, broche 1, Z, hauteur du tore H, sortie de la pince</text>

    <rect x="0" y="162" width="1120" height="44" fill="#ffffff"/>
    <text x="10" y="188" font-weight="bold">Module relais 10 A (Arduino)</text><text x="255" y="188">2</text>
    <text x="300" y="188">3 broches de commande (VCC GND IN)</text>
    <text x="640" y="188">L × l, trous, broche 1, Z, hauteur du relais H, <tspan font-weight="bold">référence/photo</tspan></text>

    <rect x="0" y="206" width="1120" height="44" fill="#f4f6f8"/>
    <text x="10" y="232" font-weight="bold">Adaptateur DS18B20</text><text x="255" y="232">2</text>
    <text x="300" y="232">23,4 × 20,3 mm, 3 broches DAT VCC GND</text>
    <text x="640" y="232">trous, broche 1 (ou on les laisse au bout du câble)</text>
  </g>
  <text x="60" y="820" class="petit">Contacteur HP/HC et disjoncteur 2 A restent sur le rail DIN : ils ne vont pas sur le PCB.</text>
  <text x="60" y="840" class="petit">Les fils secteur arrivent directement sur les borniers des modules ; le PCB ne transporte que du 3,3 V / 5 V.</text>
</svg>
