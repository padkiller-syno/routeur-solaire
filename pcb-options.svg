<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" width="1240" height="790" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="1240" height="790" fill="#ffffff"/>
  <style>
    .panel { fill: #f7f8fa; stroke: #c9ced6; stroke-width: 1.5; }
    .titre { font-weight: bold; font-size: 17px; fill: #222; }
    .sous { font-size: 12px; fill: #555; }
    .silk { font-size: 9px; fill: #ffffff; font-weight: bold; }
    .mod { fill: #e9ebef; stroke: #555; stroke-width: 1.3; }
    .modt { font-size: 11px; fill: #222; font-weight: bold; }
    .note { font-size: 12.5px; fill: #333; }
    .hv { fill: #f39c12; }
    .trace { fill: none; stroke: #d9b44a; stroke-width: 1.6; opacity: 0.85; }
  </style>
  <defs>
    <g id="pin"><rect width="4" height="4" fill="#333"/></g>
  </defs>

  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Routeur solaire : deux façons de faire un PCB</text>

  <!-- ================= OPTION 1 ================= -->
  <rect x="20" y="60" width="590" height="640" rx="12" class="panel"/>
  <text x="40" y="90" class="titre">Option 1 — Carte support (recommandée)</text>
  <text x="40" y="110" class="sous">PCB basse tension : l'ESP32 s'enfiche, chaque module se branche par un câble.</text>

  <!-- PCB -->
  <rect x="150" y="150" width="330" height="320" rx="12" fill="#1f7a3a" stroke="#14532a" stroke-width="2"/>
  <circle cx="166" cy="166" r="5" fill="#f7f8fa" stroke="#c9a227"/><circle cx="464" cy="166" r="5" fill="#f7f8fa" stroke="#c9a227"/>
  <circle cx="166" cy="454" r="5" fill="#f7f8fa" stroke="#c9a227"/><circle cx="464" cy="454" r="5" fill="#f7f8fa" stroke="#c9a227"/>
  <text x="315" y="464" text-anchor="middle" class="silk">ROUTEUR SOLAIRE v1 — basse tension seulement</text>

  <!-- pistes décoratives -->
  <path d="M184 190 H230 V262 H252" class="trace"/><path d="M184 245 H222 V286 H252" class="trace"/>
  <path d="M184 300 H214 V310 H252" class="trace"/><path d="M184 355 H222 V334 H252" class="trace"/>
  <path d="M184 410 H230 V358 H252" class="trace"/>
  <path d="M446 200 H410 V262 H384" class="trace"/><path d="M446 275 H404 V310 H384" class="trace"/>
  <path d="M446 420 H404 V430 H330" class="trace"/>

  <!-- ESP32 DevKit -->
  <rect x="245" y="182" width="140" height="262" rx="6" fill="#1d3f73" stroke="#0e2245" stroke-width="2"/>
  <rect x="268" y="190" width="94" height="52" rx="3" fill="#c7ccd3" stroke="#8a9099"/>
  <text x="315" y="220" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ESP-WROOM-32</text>
  <rect x="300" y="434" width="30" height="16" rx="3" fill="#9aa0a8" stroke="#555"/>
  <g fill="#e8c550">
    <rect x="250" y="256" width="5" height="5"/><rect x="250" y="268" width="5" height="5"/><rect x="250" y="280" width="5" height="5"/><rect x="250" y="292" width="5" height="5"/><rect x="250" y="304" width="5" height="5"/><rect x="250" y="316" width="5" height="5"/><rect x="250" y="328" width="5" height="5"/><rect x="250" y="340" width="5" height="5"/><rect x="250" y="352" width="5" height="5"/><rect x="250" y="364" width="5" height="5"/><rect x="250" y="376" width="5" height="5"/><rect x="250" y="388" width="5" height="5"/><rect x="250" y="400" width="5" height="5"/><rect x="250" y="412" width="5" height="5"/><rect x="250" y="424" width="5" height="5"/>
    <rect x="375" y="256" width="5" height="5"/><rect x="375" y="268" width="5" height="5"/><rect x="375" y="280" width="5" height="5"/><rect x="375" y="292" width="5" height="5"/><rect x="375" y="304" width="5" height="5"/><rect x="375" y="316" width="5" height="5"/><rect x="375" y="328" width="5" height="5"/><rect x="375" y="340" width="5" height="5"/><rect x="375" y="352" width="5" height="5"/><rect x="375" y="364" width="5" height="5"/><rect x="375" y="376" width="5" height="5"/><rect x="375" y="388" width="5" height="5"/><rect x="375" y="400" width="5" height="5"/><rect x="375" y="412" width="5" height="5"/><rect x="375" y="424" width="5" height="5"/>
  </g>
  <text x="315" y="330" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ESP32</text>
  <text x="315" y="345" text-anchor="middle" font-size="10" fill="#cfe0ff">DevKit V1</text>
  <text x="315" y="360" text-anchor="middle" font-size="9" fill="#cfe0ff">enfiché sur</text>
  <text x="315" y="372" text-anchor="middle" font-size="9" fill="#cfe0ff">barrettes femelles</text>

  <!-- connecteurs gauche -->
  <g>
    <rect x="158" y="178" width="26" height="46" rx="2" fill="#f4f1e8" stroke="#888"/><rect x="167" y="183" width="6" height="6" fill="#333"/><rect x="167" y="193" width="6" height="6" fill="#333"/><rect x="167" y="203" width="6" height="6" fill="#333"/><rect x="167" y="213" width="6" height="6" fill="#333"/>
    <text x="190" y="196" class="silk">DIM 1</text>
    <rect x="158" y="233" width="26" height="46" rx="2" fill="#f4f1e8" stroke="#888"/><rect x="167" y="238" width="6" height="6" fill="#333"/><rect x="167" y="248" width="6" height="6" fill="#333"/><rect x="167" y="258" width="6" height="6" fill="#333"/><rect x="167" y="268" width="6" height="6" fill="#333"/>
    <text x="190" y="251" class="silk">DIM 2</text>
    <rect x="158" y="291" width="26" height="36" rx="2" fill="#f4f1e8" stroke="#888"/><rect x="167" y="296" width="6" height="6" fill="#333"/><rect x="167" y="306" width="6" height="6" fill="#333"/><rect x="167" y="316" width="6" height="6" fill="#333"/>
    <text x="190" y="306" class="silk">RELAIS MF</text>
    <rect x="158" y="346" width="26" height="36" rx="2" fill="#f4f1e8" stroke="#888"/><rect x="167" y="351" width="6" height="6" fill="#333"/><rect x="167" y="361" width="6" height="6" fill="#333"/><rect x="167" y="371" width="6" height="6" fill="#333"/>
    <text x="190" y="361" class="silk">SURPLUS</text>
    <rect x="156" y="398" width="30" height="40" rx="2" fill="#2e9e3e" stroke="#1b5e25"/><circle cx="171" cy="406" r="3.5" fill="#cfd4da"/><circle cx="171" cy="418" r="3.5" fill="#cfd4da"/><circle cx="171" cy="430" r="3.5" fill="#cfd4da"/>
    <text x="190" y="416" class="silk">SONDE</text><text x="190" y="427" class="silk">TRIACS</text>
  </g>
  <!-- connecteurs droite -->
  <g>
    <rect x="446" y="176" width="26" height="56" rx="2" fill="#f4f1e8" stroke="#888"/><rect x="455" y="181" width="6" height="6" fill="#333"/><rect x="455" y="191" width="6" height="6" fill="#333"/><rect x="455" y="201" width="6" height="6" fill="#333"/><rect x="455" y="211" width="6" height="6" fill="#333"/><rect x="455" y="221" width="6" height="6" fill="#333"/>
    <text x="440" y="205" text-anchor="end" class="silk">JSY</text>
    <rect x="444" y="256" width="30" height="40" rx="2" fill="#2e9e3e" stroke="#1b5e25"/><circle cx="459" cy="264" r="3.5" fill="#cfd4da"/><circle cx="459" cy="276" r="3.5" fill="#cfd4da"/><circle cx="459" cy="288" r="3.5" fill="#cfd4da"/>
    <text x="440" y="274" text-anchor="end" class="silk">SONDE</text><text x="440" y="285" text-anchor="end" class="silk">BALLON</text>
    <rect x="444" y="404" width="30" height="30" rx="2" fill="#2e9e3e" stroke="#1b5e25"/><circle cx="459" cy="412" r="3.5" fill="#cfd4da"/><circle cx="459" cy="424" r="3.5" fill="#cfd4da"/>
    <text x="440" y="423" text-anchor="end" class="silk">5 V</text>
  </g>
  <!-- composants -->
  <rect x="398" y="304" width="30" height="9" rx="4" fill="#d8c08e" stroke="#7a6a45"/><text x="413" y="301" text-anchor="middle" class="silk">1k</text>
  <rect x="398" y="324" width="30" height="9" rx="4" fill="#d8c08e" stroke="#7a6a45"/><text x="413" y="345" text-anchor="middle" class="silk">2k</text>
  <rect x="434" y="306" width="10" height="24" rx="2" fill="#222"/><text x="439" y="352" text-anchor="middle" class="silk">5V/3V3</text>
  <circle cx="417" cy="380" r="13" fill="#222" stroke="#555"/><path d="M406 380 a11 11 0 0 1 4 -9" stroke="#ccc" stroke-width="3" fill="none"/>
  <text x="417" y="404" text-anchor="middle" class="silk">470 µF</text>

  <!-- modules gauche -->
  <g>
    <rect x="30" y="181" width="92" height="40" rx="6" class="mod"/><text x="76" y="198" text-anchor="middle" class="modt">Dimmer 1</text><rect x="54" y="204" width="44" height="13" rx="3" class="hv"/><text x="76" y="214" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">230 V</text>
    <path d="M122 196 C140 196 140 196 158 196" stroke="#e67e22" stroke-width="3" fill="none"/><path d="M122 206 H158" stroke="#888" stroke-width="2"/>
    <rect x="30" y="236" width="92" height="40" rx="6" class="mod"/><text x="76" y="253" text-anchor="middle" class="modt">Dimmer 2</text><rect x="54" y="259" width="44" height="13" rx="3" class="hv"/><text x="76" y="269" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">230 V</text>
    <path d="M122 251 H158" stroke="#e67e22" stroke-width="3"/><path d="M122 261 H158" stroke="#888" stroke-width="2"/>
    <rect x="30" y="290" width="92" height="40" rx="6" class="mod"/><text x="76" y="307" text-anchor="middle" class="modt">Relais MF</text><rect x="54" y="313" width="44" height="13" rx="3" class="hv"/><text x="76" y="323" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">230 V</text>
    <path d="M122 306 H158" stroke="#1e8449" stroke-width="3"/><path d="M122 316 H158" stroke="#888" stroke-width="2"/>
    <rect x="30" y="345" width="92" height="40" rx="6" class="mod"/><text x="76" y="362" text-anchor="middle" class="modt">Relais surplus</text><rect x="54" y="368" width="44" height="13" rx="3" class="hv"/><text x="76" y="378" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">230 V</text>
    <path d="M122 361 H158" stroke="#1e8449" stroke-width="3"/><path d="M122 371 H158" stroke="#888" stroke-width="2"/>
    <rect x="30" y="398" width="92" height="40" rx="6" class="mod"/><text x="76" y="415" text-anchor="middle" class="modt">Sonde triacs</text><text x="76" y="430" text-anchor="middle" font-size="9" fill="#555">sur le radiateur</text>
    <path d="M122 418 H156" stroke="#7d3c98" stroke-width="3"/>
  </g>
  <!-- modules droite -->
  <g>
    <rect x="506" y="180" width="94" height="48" rx="6" class="mod"/><text x="553" y="198" text-anchor="middle" class="modt">JSY-MK-194T</text><rect x="531" y="207" width="44" height="13" rx="3" class="hv"/><text x="553" y="217" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">230 V</text>
    <path d="M472 198 H506" stroke="#2471a3" stroke-width="3"/><path d="M472 210 H506" stroke="#888" stroke-width="2"/>
    <rect x="506" y="256" width="94" height="40" rx="6" class="mod"/><text x="553" y="273" text-anchor="middle" class="modt">Sonde ballon</text><text x="553" y="288" text-anchor="middle" font-size="9" fill="#555">doigt de gant</text>
    <path d="M474 276 H506" stroke="#7d3c98" stroke-width="3"/>
    <rect x="270" y="500" width="90" height="38" rx="6" class="mod"/><text x="315" y="516" text-anchor="middle" class="modt">Chargeur</text><text x="315" y="530" text-anchor="middle" font-size="9" fill="#555">USB 5 V ≥ 1 A</text>
    <path d="M315 450 V500" stroke="#555" stroke-width="3"/>
  </g>
  <!-- limite basse tension -->
  <rect x="140" y="140" width="350" height="340" rx="16" fill="none" stroke="#2e9e3e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="315" y="134" text-anchor="middle" font-size="11" fill="#1b5e25" font-weight="bold">zone basse tension (3,3 V / 5 V)</text>

  <g transform="translate(40,570)">
    <text x="0" y="0" class="note">✔ Aucun 230 V sur le PCB : le secteur reste sur les modules, déjà isolés.</text>
    <text x="0" y="22" class="note">✔ Connecteurs à détrompeur : impossible d'inverser un module.</text>
    <text x="0" y="44" class="note">✔ ESP32 et modules remplaçables sans souder.</text>
    <text x="0" y="66" class="note">✔ PCB 2 couches ≈ 100 × 80 mm : quelques euros les 5 chez JLCPCB.</text>
    <text x="0" y="88" class="note">✔ Boîtier imprimé en 3D aux cotes exactes du PCB.</text>
  </g>

  <!-- ================= OPTION 2 ================= -->
  <rect x="630" y="60" width="590" height="640" rx="12" class="panel"/>
  <text x="650" y="90" class="titre">Option 2 — Carte intégrée (déconseillée)</text>
  <text x="650" y="110" class="sous">Tout soudé sur un seul PCB, y compris les triacs, les relais et le 230 V.</text>

  <rect x="660" y="150" width="530" height="320" rx="12" fill="#1f7a3a" stroke="#14532a" stroke-width="2"/>
  <!-- zone BT -->
  <rect x="672" y="162" width="220" height="296" rx="8" fill="none" stroke="#9be3a8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="782" y="178" text-anchor="middle" class="silk">BASSE TENSION</text>
  <rect x="700" y="192" width="90" height="70" rx="3" fill="#c7ccd3" stroke="#8a9099"/><rect x="700" y="192" width="90" height="16" fill="#1d3f73"/>
  <text x="745" y="238" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">ESP32 nu</text>
  <rect x="805" y="200" width="28" height="28" fill="#111"/><text x="819" y="242" text-anchor="middle" class="silk">USB</text>
  <rect x="845" y="204" width="28" height="20" fill="#111"/><text x="859" y="242" text-anchor="middle" class="silk">3,3 V</text>
  <rect x="664" y="300" width="18" height="26" fill="#9aa0a8" stroke="#555"/>
  <text x="720" y="320" class="silk">micro-USB</text>
  <rect x="705" y="350" width="22" height="10" fill="#222"/><rect x="735" y="350" width="22" height="10" fill="#222"/><rect x="765" y="350" width="22" height="10" fill="#222"/>
  <text x="746" y="378" text-anchor="middle" class="silk">résistances, filtres, ZC…</text>
  <!-- fente d'isolement -->
  <rect x="903" y="176" width="12" height="272" rx="6" fill="#f7f8fa" stroke="#14532a"/>
  <text x="909" y="465" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">fente</text>
  <path d="M893 160 H925" stroke="#ffcc00" stroke-width="2"/><path d="M893 156 V164 M925 156 V164" stroke="#ffcc00" stroke-width="2"/>
  <text x="909" y="152" text-anchor="middle" font-size="10" fill="#b8860b" font-weight="bold">≥ 6 mm</text>
  <!-- optos à cheval -->
  <rect x="890" y="290" width="38" height="16" fill="#111"/><rect x="890" y="330" width="38" height="16" fill="#111"/><rect x="890" y="370" width="38" height="16" fill="#111"/>
  <text x="940" y="420" class="silk">optocoupleurs à cheval</text>
  <!-- zone HT -->
  <rect x="930" y="162" width="250" height="296" rx="8" fill="none" stroke="#ff8a80" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1055" y="178" text-anchor="middle" class="silk">230 V</text>
  <rect x="950" y="188" width="120" height="74" fill="#9aa0a8" stroke="#555"/>
  <g stroke="#6b7078" stroke-width="3"><path d="M960 190 V260"/><path d="M975 190 V260"/><path d="M990 190 V260"/><path d="M1005 190 V260"/><path d="M1020 190 V260"/><path d="M1035 190 V260"/><path d="M1050 190 V260"/><path d="M1065 190 V260"/></g>
  <rect x="972" y="226" width="24" height="30" fill="#111"/><rect x="1022" y="226" width="24" height="30" fill="#111"/>
  <text x="1010" y="277" text-anchor="middle" class="silk">triacs + radiateur</text>
  <rect x="1090" y="190" width="70" height="48" rx="3" fill="#2a5db0" stroke="#173a73"/><rect x="1090" y="246" width="70" height="48" rx="3" fill="#2a5db0" stroke="#173a73"/>
  <text x="1125" y="218" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">relais</text><text x="1125" y="274" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">relais</text>
  <path d="M960 330 H1150" stroke="#e8a33a" stroke-width="9"/><path d="M960 360 H1150" stroke="#e8a33a" stroke-width="9"/>
  <text x="1055" y="388" text-anchor="middle" class="silk">pistes larges 8–16 A</text>
  <rect x="1150" y="400" width="34" height="52" rx="2" fill="#2e9e3e" stroke="#1b5e25"/><circle cx="1167" cy="410" r="3.5" fill="#cfd4da"/><circle cx="1167" cy="426" r="3.5" fill="#cfd4da"/><circle cx="1167" cy="442" r="3.5" fill="#cfd4da"/>
  <text x="1144" y="430" text-anchor="end" class="silk">L / N / LOAD</text>
  <!-- JSY à part -->
  <rect x="1076" y="500" width="128" height="40" rx="6" class="mod"/><text x="1140" y="518" text-anchor="middle" class="modt">JSY-MK-194T</text><text x="1140" y="532" text-anchor="middle" font-size="9" fill="#555">reste un module à part</text>
  <path d="M1140 470 V500" stroke="#2471a3" stroke-width="3"/>

  <g transform="translate(650,570)">
    <text x="0" y="0" class="note">✘ 230 V sur le PCB : distances d'isolement, fentes, normes à respecter.</text>
    <text x="0" y="22" class="note">✘ Pistes épaisses et radiateur de triac à dimensionner (8 à 16 A).</text>
    <text x="0" y="44" class="note">✘ Une erreur peut rendre la basse tension dangereuse au toucher.</text>
    <text x="0" y="66" class="note">✘ Tout est soudé : un composant grillé = carte à reprendre.</text>
    <text x="0" y="88" class="note">✘ Le JSY reste de toute façon un module externe.</text>
  </g>

  <!-- bandeau -->
  <rect x="20" y="715" width="590" height="56" rx="10" fill="#e3f4e6" stroke="#2e9e3e"/>
  <text x="315" y="740" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e25">Recommandé : fiable, sûr, réparable</text>
  <text x="315" y="760" text-anchor="middle" font-size="12" fill="#1b5e25">PCB JLCPCB + boîtier imprimé en 3D</text>
  <rect x="630" y="715" width="590" height="56" rx="10" fill="#fdecea" stroke="#c0392b"/>
  <text x="925" y="740" text-anchor="middle" font-size="15" font-weight="bold" fill="#922b21">Réservé à un produit fini et certifié</text>
  <text x="925" y="760" text-anchor="middle" font-size="12" fill="#922b21">beaucoup plus de risques pour peu de gain</text>
</svg>
