<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1100" width="1040" height="1100" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="1040" height="1100" fill="#ffffff"/>
  <style>
    .box { fill: #f6f7f9; stroke: #444; stroke-width: 1.5; }
    .titre { font-weight: bold; font-size: 14px; fill: #222; }
    .t13 { font-weight: bold; font-size: 13px; fill: #222; }
    .petit { font-size: 11px; fill: #555; }
    .pin { font-size: 12px; fill: #222; font-weight: bold; }
    .libre { font-size: 12px; fill: #aaa; }
    .fil { fill: none; stroke-width: 3; stroke-linejoin: round; }
    .v33 { fill: none; stroke: #d6337a; stroke-width: 3; stroke-linejoin: round; }
    .v5 { fill: none; stroke: #c0392b; stroke-width: 3; stroke-linejoin: round; }
    .gnd { fill: none; stroke: #222; stroke-width: 3; stroke-linejoin: round; }
    .t33 { fill: #d6337a; font-weight: bold; }
    .t5 { fill: #c0392b; font-weight: bold; }
    .res { fill: #fff; stroke: #444; stroke-width: 1.5; }
  </style>

  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Routeur solaire — câblage ESP32 DevKit V1 (ESPHome)</text>
  <text x="520" y="56" text-anchor="middle" class="petit">Carte vue de dessus, antenne en haut, micro-USB en bas. 3,3 V depuis la broche 3V3, 5 V depuis VIN (alimentée par l'USB), masse commune.</text>

  <!-- ===================== ESP32 DevKit V1 ===================== -->
  <rect x="430" y="110" width="180" height="510" rx="8" style="fill:#e8f0fe;stroke:#444;stroke-width:1.5"/>
  <rect x="465" y="120" width="110" height="26" fill="#c9d6ea" stroke="#777" rx="3"/>
  <text x="520" y="138" text-anchor="middle" class="petit">ESP-WROOM-32</text>
  <text x="520" y="604" text-anchor="middle" class="t13">ESP32 DevKit V1</text>
  <g>
    <circle cx="430" cy="160" r="4" fill="#bbb"/><text x="440" y="164" class="libre">EN</text>
    <circle cx="430" cy="190" r="4" fill="#bbb"/><text x="440" y="194" class="libre">VP</text>
    <circle cx="430" cy="220" r="4" fill="#bbb"/><text x="440" y="224" class="libre">VN</text>
    <circle cx="430" cy="250" r="4" fill="#bbb"/><text x="440" y="254" class="libre">D34</text>
    <circle cx="430" cy="280" r="5" fill="#e67e22"/><text x="440" y="284" class="pin">D35</text>
    <circle cx="430" cy="310" r="5" fill="#e67e22"/><text x="440" y="314" class="pin">D32</text>
    <circle cx="430" cy="340" r="5" fill="#e67e22"/><text x="440" y="344" class="pin">D33</text>
    <circle cx="430" cy="370" r="5" fill="#1e8449"/><text x="440" y="374" class="pin">D25</text>
    <circle cx="430" cy="400" r="5" fill="#1e8449"/><text x="440" y="404" class="pin">D26</text>
    <circle cx="430" cy="430" r="5" fill="#7d3c98"/><text x="440" y="434" class="pin">D27</text>
    <circle cx="430" cy="460" r="4" fill="#bbb"/><text x="440" y="464" class="libre">D14</text>
    <circle cx="430" cy="490" r="4" fill="#bbb"/><text x="440" y="494" class="libre">D12</text>
    <circle cx="430" cy="520" r="5" fill="#1e8449"/><text x="440" y="524" class="pin">D13</text>
    <circle cx="430" cy="550" r="4" fill="#bbb"/><text x="440" y="554" class="libre">GND</text>
    <circle cx="430" cy="580" r="5" fill="#c0392b"/><text x="440" y="584" class="pin t5">VIN <tspan class="petit">(5 V USB)</tspan></text>
  </g>
  <g text-anchor="end">
    <circle cx="610" cy="160" r="4" fill="#bbb"/><text x="600" y="164" class="libre">D23</text>
    <circle cx="610" cy="190" r="4" fill="#bbb"/><text x="600" y="194" class="libre">D22</text>
    <circle cx="610" cy="220" r="4" fill="#bbb"/><text x="600" y="224" class="libre">TX0</text>
    <circle cx="610" cy="250" r="4" fill="#bbb"/><text x="600" y="254" class="libre">RX0</text>
    <circle cx="610" cy="280" r="4" fill="#bbb"/><text x="600" y="284" class="libre">D21</text>
    <circle cx="610" cy="310" r="4" fill="#bbb"/><text x="600" y="314" class="libre">D19</text>
    <circle cx="610" cy="340" r="4" fill="#bbb"/><text x="600" y="344" class="libre">D18</text>
    <circle cx="610" cy="370" r="4" fill="#bbb"/><text x="600" y="374" class="libre">D5</text>
    <circle cx="610" cy="400" r="5" fill="#2471a3"/><text x="600" y="404" class="pin">TX2</text>
    <circle cx="610" cy="430" r="5" fill="#2471a3"/><text x="600" y="434" class="pin">RX2</text>
    <circle cx="610" cy="460" r="5" fill="#7d3c98"/><text x="600" y="464" class="pin">D4</text>
    <circle cx="610" cy="490" r="4" fill="#bbb"/><text x="600" y="494" class="libre">D2</text>
    <circle cx="610" cy="520" r="4" fill="#bbb"/><text x="600" y="524" class="libre">D15</text>
    <circle cx="610" cy="550" r="5" fill="#222"/><text x="600" y="554" class="pin">GND</text>
    <circle cx="610" cy="580" r="5" fill="#d6337a"/><text x="600" y="584" class="pin t33">3V3</text>
  </g>
  <text x="520" y="638" text-anchor="middle" class="petit">micro-USB ← chargeur 5 V ≥ 1 A</text>

  <!-- ===================== Dimmer 1 ===================== -->
  <rect x="60" y="230" width="220" height="100" rx="8" class="box"/>
  <text x="74" y="248" class="titre">Dimmer 1 (ballon)</text>
  <text x="70" y="268" class="pin t33">VCC</text>
  <text x="70" y="288" class="pin">GND</text>
  <text x="74" y="308" class="petit">LOAD → ballon</text>
  <text x="74" y="322" class="petit">AC-IN : L + N</text>
  <text x="270" y="284" text-anchor="end" class="pin">Z-C</text>
  <text x="270" y="314" text-anchor="end" class="pin">PWM</text>
  <path d="M280 280 H430" class="fil" stroke="#e67e22"/>
  <path d="M280 310 H430" class="fil" stroke="#e67e22" stroke-dasharray="9 4"/>

  <!-- ===================== Dimmer 2 ===================== -->
  <rect x="60" y="345" width="220" height="80" rx="8" class="box"/>
  <text x="74" y="362" class="titre">Dimmer 2 (option)</text>
  <text x="70" y="380" class="pin t33">VCC</text>
  <text x="70" y="400" class="pin">GND</text>
  <text x="74" y="418" class="petit">LOAD → 2e charge · Z-C libre</text>
  <text x="270" y="389" text-anchor="end" class="pin">PWM</text>
  <path d="M430 340 H345 V385 H280" class="fil" stroke="#e67e22" stroke-dasharray="9 4"/>

  <!-- ===================== Relais ===================== -->
  <rect x="60" y="440" width="220" height="80" rx="8" class="box"/>
  <text x="74" y="458" class="titre">Relais marche forcée</text>
  <text x="70" y="476" class="pin t5">VCC</text>
  <text x="70" y="496" class="pin">GND</text>
  <text x="74" y="514" class="petit">COM ← L · NC → A1 contacteur</text>
  <text x="270" y="484" text-anchor="end" class="pin">IN</text>
  <path d="M430 370 H365 V480 H280" class="fil" stroke="#1e8449" stroke-dasharray="9 4"/>

  <rect x="60" y="535" width="220" height="80" rx="8" class="box"/>
  <text x="74" y="553" class="titre">Relais surplus</text>
  <text x="70" y="571" class="pin t5">VCC</text>
  <text x="70" y="591" class="pin">GND</text>
  <text x="74" y="609" class="petit">COM/NO : charge annexe ≤ 5 A</text>
  <text x="270" y="579" text-anchor="end" class="pin">IN</text>
  <path d="M430 400 H385 V575 H280" class="fil" stroke="#1e8449"/>

  <!-- ===================== Sonde triac ===================== -->
  <rect x="60" y="630" width="220" height="90" rx="8" class="box"/>
  <text x="74" y="648" class="titre">DS18B20 triacs</text>
  <text x="70" y="666" class="pin t33">VCC</text>
  <text x="70" y="686" class="pin">GND</text>
  <text x="74" y="704" class="petit">adaptateur · sur le radiateur</text>
  <text x="74" y="716" class="petit">coupure 75 °C, reprise 60 °C</text>
  <text x="270" y="678" text-anchor="end" class="pin">DAT</text>
  <path d="M430 430 H405 V674 H280" class="fil" stroke="#7d3c98"/>

  <!-- ===================== JSY ===================== -->
  <rect x="760" y="370" width="220" height="120" rx="8" class="box"/>
  <text x="870" y="388" text-anchor="middle" class="titre">JSY-MK-194T</text>
  <text x="770" y="404" class="pin">RX</text>
  <text x="770" y="434" class="pin">TX</text>
  <text x="970" y="416" text-anchor="end" class="pin t5">VCC</text>
  <text x="970" y="436" text-anchor="end" class="pin">GND</text>
  <text x="770" y="456" class="petit">38 400 bauds · PF libre · UL/NL 230 V</text>
  <text x="770" y="470" class="petit">tore : fil du ballon</text>
  <text x="770" y="484" class="petit">pince : tableau (rallongée)</text>
  <!-- TX2 → RX du JSY -->
  <path d="M610 400 H760" class="fil" stroke="#2471a3" stroke-dasharray="9 4"/>
  <polygon points="694,395 706,400 694,405" fill="#2471a3"/>
  <!-- TX du JSY → pont diviseur → RX2 -->
  <path d="M760 430 H736" class="fil" stroke="#2471a3"/>
  <rect x="700" y="422" width="36" height="16" class="res"/>
  <text x="718" y="416" text-anchor="middle" class="petit">1 kΩ</text>
  <path d="M700 430 H610" class="fil" stroke="#2471a3"/>
  <polygon points="636,425 624,430 636,435" fill="#2471a3"/>
  <circle cx="665" cy="430" r="3.5" fill="#2471a3"/>
  <path d="M665 430 V438" stroke="#2471a3" stroke-width="2"/>
  <rect x="657" y="438" width="16" height="26" class="res"/>
  <text x="679" y="456" class="petit">2 kΩ</text>
  <!-- 2 kΩ vers la masse : saute la sonde ballon (540) et le 3,3 V (750) -->
  <path d="M665 464 V534 A6 6 0 0 1 665 546 V744 A6 6 0 0 1 665 756 V790" class="gnd" stroke-width="2"/>

  <!-- ===================== DS18B20 ballon ===================== -->
  <rect x="760" y="500" width="220" height="90" rx="8" class="box"/>
  <text x="774" y="518" class="titre">DS18B20 ballon</text>
  <text x="774" y="532" class="petit">adaptateur, 4,7 kΩ intégrée</text>
  <text x="770" y="544" class="pin">DAT</text>
  <text x="970" y="552" text-anchor="end" class="pin t33">VCC</text>
  <text x="970" y="576" text-anchor="end" class="pin">GND</text>
  <path d="M610 460 H640 V540 H760" class="fil" stroke="#7d3c98"/>

  <!-- ===================== Alimentations ===================== -->
  <!-- départs depuis la carte -->
  <path d="M610 580 H630 V750" class="v33"/>
  <circle cx="630" cy="750" r="4" fill="#d6337a"/>
  <path d="M610 550 H652 V744 A6 6 0 0 1 652 756 V790" class="gnd"/>
  <circle cx="652" cy="790" r="4" fill="#222"/>
  <path d="M430 580 H420 V744 A6 6 0 0 0 420 756 V784 A6 6 0 0 0 420 796 V830" class="v5"/>
  <circle cx="420" cy="830" r="4" fill="#c0392b"/>
  <circle cx="665" cy="790" r="4" fill="#222"/>

  <!-- rails du bas -->
  <path d="M40 750 H985" class="v33"/>
  <path d="M22 790 H1000" class="gnd"/>
  <path d="M8 830 H1015" class="v5"/>
  <text x="230" y="770" text-anchor="middle" class="petit" fill="#d6337a">3,3 V (broche 3V3)</text>
  <text x="230" y="810" text-anchor="middle" class="petit" fill="#222">masse commune (GND)</text>
  <text x="230" y="850" text-anchor="middle" class="petit" fill="#c0392b">+5 V (broche VIN = USB)</text>

  <!-- gauche : 3,3 V (x = 40), masse (x = 22, saute le 3,3 V), 5 V (x = 8, saute masse et 3,3 V) -->
  <path d="M40 750 V264 H60" class="v33"/>
  <path d="M40 376 H60" class="v33"/><circle cx="40" cy="376" r="4" fill="#d6337a"/>
  <path d="M40 662 H60" class="v33"/><circle cx="40" cy="662" r="4" fill="#d6337a"/>
  <path d="M22 790 V284 H34 A6 6 0 0 1 46 284 H60" class="gnd"/>
  <path d="M22 396 H34 A6 6 0 0 1 46 396 H60" class="gnd"/><circle cx="22" cy="396" r="4" fill="#222"/>
  <path d="M22 492 H34 A6 6 0 0 1 46 492 H60" class="gnd"/><circle cx="22" cy="492" r="4" fill="#222"/>
  <path d="M22 587 H34 A6 6 0 0 1 46 587 H60" class="gnd"/><circle cx="22" cy="587" r="4" fill="#222"/>
  <path d="M22 682 H34 A6 6 0 0 1 46 682 H60" class="gnd"/><circle cx="22" cy="682" r="4" fill="#222"/>
  <path d="M8 830 V472 H16 A6 6 0 0 1 28 472 H34 A6 6 0 0 1 46 472 H60" class="v5"/>
  <path d="M8 567 H16 A6 6 0 0 1 28 567 H34 A6 6 0 0 1 46 567 H60" class="v5"/><circle cx="8" cy="567" r="4" fill="#c0392b"/>

  <!-- droite : 3,3 V (x = 985), masse (x = 1000), 5 V (x = 1015) -->
  <path d="M985 750 V548 H980" class="v33"/>
  <path d="M1000 790 V432 H980" class="gnd"/>
  <path d="M1000 572 H991 A6 6 0 0 0 979 572" class="gnd"/><circle cx="1000" cy="572" r="4" fill="#222"/>
  <path d="M1015 830 V412 H980" class="v5"/>

  <!-- ===================== Légende ===================== -->
  <g transform="translate(60,885)">
    <text x="0" y="0" class="titre">Légende</text>
    <path d="M0 18 H34" class="fil" stroke="#e67e22"/><text x="42" y="22">dimmers</text>
    <path d="M125 18 H159" class="fil" stroke="#2471a3"/><text x="167" y="22">JSY (UART2, flèche = sens)</text>
    <path d="M370 18 H404" class="fil" stroke="#1e8449"/><text x="412" y="22">relais</text>
    <path d="M475 18 H509" class="fil" stroke="#7d3c98"/><text x="517" y="22">DS18B20</text>
    <path d="M605 18 H639" class="v33"/><text x="647" y="22">3,3 V</text>
    <path d="M705 18 H739" class="v5"/><text x="747" y="22">+5 V</text>
    <path d="M805 18 H839" class="gnd"/><text x="847" y="22">masse</text>
    <circle cx="4" cy="44" r="4" fill="#222"/><text x="14" y="48" class="petit">point = connexion</text>
    <path d="M140 44 H150 A6 6 0 0 1 162 44 H172" fill="none" stroke="#555" stroke-width="2"/><text x="180" y="48" class="petit">saut = croisement sans contact</text>
    <rect x="370" y="38" width="24" height="12" class="res"/><text x="402" y="48" class="petit">résistance</text>
    <circle cx="500" cy="44" r="4" fill="#bbb"/><text x="510" y="48" class="petit">broche non utilisée</text>
  </g>

  <!-- ===================== Remarques ===================== -->
  <rect x="40" y="950" width="960" height="140" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5" rx="8"/>
  <text x="56" y="974" class="titre">À vérifier avant de brancher</text>
  <text x="56" y="996">• Pont diviseur 1 kΩ / 2 kΩ : seulement si le TX du JSY sort du 5 V (le mesurer) ; sinon TX directement sur RX2 (GPIO16).</text>
  <text x="56" y="1016">• 5 V : VIN est relié à l'USB ; chargeur ≥ 1 A (ESP32 + JSY + 2 relais ≈ 0,6 A en pointe). 3,3 V : dimmers + sondes &lt; 20 mA.</text>
  <text x="56" y="1036">• Dimmer 2 : son Z-C reste libre, celui du dimmer 1 sert aux deux. La sonde « triacs » se colle sur le radiateur le plus chaud.</text>
  <text x="56" y="1056">• Broches de démarrage (0, 2, 5, 12, 15) laissées libres ; D35 est une entrée seule, parfaite pour le Z-C.</text>
  <text x="56" y="1076">• Relais : vérifier le déclenchement (haut/bas) des modules. D13 → MOSFET du ventilateur 5 V des dimmers (tout ou rien, sur le PCB).</text>
</svg>
